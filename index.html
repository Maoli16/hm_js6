<h2>Список справ</h2>

<button id="taskBtn">Додати</button>
<ul id="taskList"></ul>

<!-- ------2------ -->

<button id="bulbBtn">Увімкнути</button>

    <input id="userPass" type="password" placeholder="Введіть пароль">

</form>
<p id="regMessage"></p>

<!-- ----------bonus------------- -->
